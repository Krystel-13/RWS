<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30.09.25</title>
    <style>
        /* Importación de la fuente para el título */
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

        /* --- MÓDULO DE COLORES EDITABLES --- */
        :root {
            /* Colores de las flores - AZULES */
            --color-petalo-principal: rgb(0, 100, 255);
            --color-petalo-gradiente: rgba(0, 20, 80, 0.5);
            --color-petalo-neon: rgba(0, 120, 255, 0.7);
            --color-centro-flor: #f0f8ff;
            --color-centro-flor-sombra: #87ceeb;
            --color-luz-particula-1: #6495ed;
            --color-luz-particula-2: #b0e0e6;

            /* Colores de los tallos y hojas */
            --color-tallo-principal: #006400;
            --color-tallo-hoja: #004d00;
            --color-pasto-brillante: #228b22;
            --color-sombra-hojas: rgba(0, 20, 40, 0.2);
            --color-luz-hojas: rgba(173, 216, 230, 0.2);
            
            /* Colores del fondo - AZUL */
            --color-fondo-oscuro: rgba(0, 20, 60, 0.7);
            --color-superposicion-fondo: rgba(0, 30, 80, 0.85);
            
            /* Color del Título principal */
            --color-titulo: #1e90ff;
            --color-titulo-neon: rgba(30, 144, 255, 0.5);
            --color-sombra-titulo: rgba(0, 0, 0, 0.7);

            /* --- NUEVAS VARIABLES EDITABLES --- */
            /* Colores para el Overlay de Audio */
            --color-overlay-glow: rgba(255, 215, 0, 0.8); /* Amarillo para el rayo */
            --color-overlay-title: #ffffff;
            --color-overlay-title-neon: rgba(173, 216, 230, 0.7);
        }

        /* --- FIN DEL MÓDULO DE COLORES --- */

        *,
        *::after,
        *::before {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--color-fondo-oscuro);
            /* Fondo azul en lugar de imagen */
            background: linear-gradient(to bottom, #0a1f44, #1e3c72, #2a5298);
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            overflow: hidden;
            perspective: 1000px;
        }

        .title-container {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 1500px;
            opacity: 0;
            transition: opacity 1.2s ease-in-out 0.5s;
        }

        /* --- TÍTULO Y PÉTALOS --- */

        /* Título principal con brillo neón */
        .main-title {
            color: var(--color-titulo);
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2rem, 8vw, 4rem); /* Título más pequeño */
            text-shadow: 
                0 0 5px rgba(25, 0, 5, 0.8),
                0 0 10px var(--color-titulo-neon),
                0 0 15px var(--color-titulo-neon),
                2px 2px 5px var(--color-sombra-titulo);
            text-align: center;
            margin: 0;
        }

        .night {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: var(--color-superposicion-fondo);
            z-index: -1;
        }

        .flowers {
            position: relative;
            transform: scale(0.7);
        }

        .flower {
            position: absolute;
            bottom: 10vmin;
            transform-origin: bottom center;
            z-index: 10;
            --fl-speed: 0.8s;
        }
        .flower--1 {
            animation: moving-flower-1 4s linear infinite;
        }
        .flower--1 .flower__line {
            height: 70vmin;
            animation-delay: 0.3s;
        }
        .flower--1 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 1.6s backwards; }
        .flower--1 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 1.4s backwards; }
        .flower--1 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 1.2s backwards; }
        .flower--1 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 1s backwards; }
        .flower--1 .flower__line__leaf--5 { animation: blooming-leaf-right var(--fl-speed) 1.8s backwards; }
        .flower--1 .flower__line__leaf--6 { animation: blooming-leaf-left var(--fl-speed) 2s backwards; }
        
        .flower--2 {
            left: 50%;
            transform: rotate(20deg);
            animation: moving-flower-2 4s linear infinite;
        }
        .flower--2 .flower__line {
            height: 60vmin;
            animation-delay: 0.6s;
        }
        .flower--2 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 1.9s backwards; }
        .flower--2 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 1.7s backwards; }
        .flower--2 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 1.5s backwards; }
        .flower--2 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 1.3s backwards; }
        
        .flower--3 {
            left: 50%;
            transform: rotate(-15deg);
            animation: moving-flower-3 4s linear infinite;
        }
        .flower--3 .flower__line {
            animation-delay: 0.9s;
        }
        .flower--3 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 2.5s backwards; }
        .flower--3 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 2.3s backwards; }
        .flower--3 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 2.1s backwards; }
        .flower--3 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 1.9s backwards; }
        
        /* NUEVAS FLORES AGREGADAS */
        .flower--4 {
            left: 40%;
            transform: rotate(5deg);
            animation: moving-flower-4 4s linear infinite;
        }
        .flower--4 .flower__line {
            height: 65vmin;
            animation-delay: 1.1s;
        }
        .flower--4 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 2.7s backwards; }
        .flower--4 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 2.5s backwards; }
        .flower--4 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 2.3s backwards; }
        .flower--4 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 2.1s backwards; }
        
        .flower--5 {
            left: 60%;
            transform: rotate(-5deg);
            animation: moving-flower-5 4s linear infinite;
        }
        .flower--5 .flower__line {
            height: 55vmin;
            animation-delay: 1.3s;
        }
        .flower--5 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 2.9s backwards; }
        .flower--5 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 2.7s backwards; }
        .flower--5 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 2.5s backwards; }
        .flower--5 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 2.3s backwards; }
        
        /* FLORES 6 Y 7 - NUEVAS FLORES AZULES DETRÁS DE LAS 1, 2 Y 3 */
        .flower--6 {
            left: 35%;
            transform: rotate(10deg);
            animation: moving-flower-6 4s linear infinite;
            z-index: 5; /* Detrás de las flores con imágenes */
        }
        .flower--6 .flower__line {
            height: 75vmin;
            animation-delay: 1.5s;
        }
        .flower--6 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 3.1s backwards; }
        .flower--6 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 2.9s backwards; }
        .flower--6 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 2.7s backwards; }
        .flower--6 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 2.5s backwards; }
        
        .flower--7 {
            left: 65%;
            transform: rotate(-10deg);
            animation: moving-flower-7 4s linear infinite;
            z-index: 5; /* Detrás de las flores con imágenes */
        }
        .flower--7 .flower__line {
            height: 70vmin;
            animation-delay: 1.7s;
        }
        .flower--7 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 3.3s backwards; }
        .flower--7 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 3.1s backwards; }
        .flower--7 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 2.9s backwards; }
        .flower--7 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 2.7s backwards; }
        
        /* ESTILOS PARA IMÁGENES CUADRADAS EN LUGAR DE FLORES */
        .flower__image-container {
            position: relative;
            width: 15vmin;
            height: 20vmin;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px var(--color-petalo-neon);
            border: 3px solid var(--color-petalo-principal);
            animation: blooming-flower 2s backwards;
            z-index: 20;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .flower__image-container:hover {
            transform: scale(1.05);
        }

        .flower__image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .flower__image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--color-petalo-principal), var(--color-petalo-gradiente));
            color: white;
            font-size: 1.5vmin;
            text-align: center;
            padding: 10px;
        }

        .flower__image-container::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            transform: translate(-50%, -100%);
            width: 8vmin;
            height: 8vmin;
            background-color: var(--color-tallo-hoja);
            filter: blur(10vmin);
        }

        .flower__leafs {
            position: relative;
            animation: blooming-flower 2s backwards;
        }
        .flower__leafs--1 { animation-delay: 1.1s; }
        .flower__leafs--2 { animation-delay: 1.4s; }
        .flower__leafs--3 { animation-delay: 1.7s; }
        .flower__leafs--4 { animation-delay: 1.9s; }
        .flower__leafs--5 { animation-delay: 2.1s; }
        .flower__leafs--6 { animation-delay: 2.3s; }
        .flower__leafs--7 { animation-delay: 2.5s; }

        .flower__line {
            height: 55vmin;
            width: 1.5vmin;
            background-image: linear-gradient(to left, var(--color-sombra-hojas), transparent, var(--color-luz-hojas)), linear-gradient(to top, transparent 10%, var(--color-tallo-principal), var(--color-tallo-principal));
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
            animation: grow-flower-tree 4s backwards;
        }
        .flower__line__leaf {
            --w: 7vmin;
            --h: calc(var(--w) + 2vmin);
            position: absolute;
            top: 20%;
            left: 90%;
            width: var(--w);
            height: var(--h);
            border-top-right-radius: var(--h);
            border-bottom-left-radius: var(--h);
            background-image: linear-gradient(to top, rgba(20, 122, 20, 0.4), var(--color-tallo-hoja));
        }
        .flower__line__leaf--1 { transform: rotate(70deg) rotateY(30deg); }
        .flower__line__leaf--2 {
            top: 45%;
            transform: rotate(70deg) rotateY(30deg);
        }
        .flower__line__leaf--3, .flower__line__leaf--4, .flower__line__leaf--6 {
            border-top-right-radius: 0;
            border-bottom-left-radius: 0;
            border-top-left-radius: var(--h);
            border-bottom-right-radius: var(--h);
            left: -460%;
            top: 12%;
            transform: rotate(-70deg) rotateY(30deg);
        }
        .flower__line__leaf--4 { top: 40%; }
        .flower__line__leaf--5 {
            top: 0;
            transform-origin: left;
            transform: rotate(70deg) rotateY(30deg) scale(0.6);
        }
        .flower__line__leaf--6 {
            top: -2%;
            left: -450%;
            transform-origin: right;
            transform: rotate(-70deg) rotateY(30deg) scale(0.6);
        }
        .flower__light {
            position: absolute;
            bottom: 0vmin;
            width: 1vmin;
            height: 1vmin;
            background-color: var(--color-luz-particula-1);
            border-radius: 50%;
            filter: blur(0.2vmin);
            animation: light-ans 4s linear infinite backwards;
        }
        .flower__light:nth-child(odd) {
            background-color: var(--color-luz-particula-2);
        }
        .flower__light--1 { left: -2vmin; animation-delay: 1s; }
        .flower__light--2 { left: 3vmin; animation-delay: 0.5s; }
        .flower__light--3 { left: -6vmin; animation-delay: 0.3s; }
        .flower__light--4 { left: 6vmin; animation-delay: 0.9s; }
        .flower__light--5 { left: -1vmin; animation-delay: 1.5s; }
        .flower__light--6 { left: -4vmin; animation-delay: 3s; }
        .flower__light--7 { left: 3vmin; animation-delay: 2s; }
        .flower__light--8 { left: -6vmin; animation-delay: 3.5s; }
        
        .flower__grass {
            --c: var(--color-pasto-brillante);
            --line-w: 1.5vmin;
            position: absolute;
            bottom: 12vmin;
            left: -7vmin;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 20;
            transform-origin: bottom center;
            transform: rotate(-48deg) rotateY(40deg);
        }
        .flower__grass--1 { animation: moving-grass 2s linear infinite; }
        .flower__grass--2 {
            left: 2vmin;
            bottom: 10vmin;
            transform: scale(0.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);
            opacity: 0.8;
            z-index: 0;
            animation: moving-grass--2 1.5s linear infinite;
        }
        .flower__grass--top {
            width: 7vmin;
            height: 10vmin;
            border-top-right-radius: 100%;
            border-right: var(--line-w) solid var(--c);
            transform-origin: bottom center;
            transform: rotate(-2deg);
        }
        .flower__grass--bottom {
            margin-top: -2px;
            width: var(--line-w);
            height: 25vmin;
            background-image: linear-gradient(to top, transparent, var(--c));
        }
        .flower__grass__leaf {
            --size: 10vmin;
            position: absolute;
            width: calc(var(--size) * 2.1);
            height: var(--size);
            border-top-left-radius: var(--size);
            border-top-right-radius: var(--size);
            background-image: linear-gradient(to top, transparent, transparent 30%, var(--c));
            z-index: 100;
        }
        .flower__grass__leaf--1 { top: -6%; left: 30%; --size: 6vmin; transform: rotate(-20deg); animation: growing-grass-ans--1 2s 2.6s backwards; }
        .flower__grass__leaf--2 { top: -5%; left: -110%; --size: 6vmin; transform: rotate(10deg); animation: growing-grass-ans--2 2s 2.4s linear backwards; }
        .flower__grass__leaf--3 { top: 5%; left: 60%; --size: 8vmin; transform: rotate(-18deg) rotateX(-20deg); animation: growing-grass-ans--3 2s 2.2s linear backwards; }
        .flower__grass__leaf--4 { top: 6%; left: -135%; --size: 8vmin; transform: rotate(2deg); animation: growing-grass-ans--4 2s 2s linear backwards; }
        .flower__grass__leaf--5 { top: 20%; left: 60%; --size: 10vmin; transform: rotate(-24deg) rotateX(-20deg); animation: growing-grass-ans--5 2s 1.8s linear backwards; }
        .flower__grass__leaf--6 { top: 22%; left: -180%; --size: 10vmin; transform: rotate(10deg); animation: growing-grass-ans--6 2s 1.6s linear backwards; }
        .flower__grass__leaf--7 { top: 39%; left: 70%; --size: 10vmin; transform: rotate(-10deg); animation: growing-grass-ans--7 2s 1.4s linear backwards; }
        .flower__grass__leaf--8 { top: 40%; left: -215%; --size: 11vmin; transform: rotate(10deg); animation: growing-grass-ans--8 2s 1.2s linear backwards; }
        .flower__grass__overlay {
            position: absolute;
            top: -10%;
            right: 0%;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            filter: blur(1.5vmin);
            z-index: 100;
        }
        .flower__g-long {
            --w: 2vmin;
            --h: 6vmin;
            --c: var(--color-tallo-hoja);
            position: absolute;
            bottom: 10vmin;
            left: -3vmin;
            transform-origin: bottom center;
            transform: rotate(-30deg) rotateY(-20deg);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            animation: flower-g-long-ans 3s linear infinite;
        }
        .flower__g-long__top {
            top: calc(var(--h) * -1);
            width: calc(var(--w) + 1vmin);
            height: var(--h);
            border-top-right-radius: 100%;
            border-right: 0.7vmin solid var(--c);
            transform: translate(-0.7vmin, 1vmin);
        }
        .flower__g-long__bottom {
            width: var(--w);
            height: 50vmin;
            transform-origin: bottom center;
            background-image: linear-gradient(to top, transparent 30%, var(--c));
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
            clip-path: polygon(35% 0, 65% 1%, 100% 100%, 0% 100%);
        }
        .flower__g-right {
            position: absolute;
            bottom: 6vmin;
            left: -2vmin;
            transform-origin: bottom left;
            transform: rotate(20deg);
        }
        .flower__g-right .leaf {
            width: 30vmin;
            height: 50vmin;
            border-top-left-radius: 100%;
            border-left: 2vmin solid var(--color-pasto-brillante);
            background-image: linear-gradient(to bottom, transparent, var(--color-fondo-oscuro) 60%);
            -webkit-mask-image: linear-gradient(to top, transparent 30%, var(--color-pasto-brillante) 60%);
        }
        .flower__g-right--1 { animation: flower-g-right-ans 2.5s linear infinite; }
        .flower__g-right--2 {
            left: 5vmin;
            transform: rotateY(-180deg);
            animation: flower-g-right-ans--2 3s linear infinite;
        }
        .flower__g-right--2 .leaf {
            height: 75vmin;
            filter: blur(0.3vmin);
            opacity: 0.8;
        }
        
        .flower__g-front {
            position: absolute;
            bottom: 6vmin;
            left: 2.5vmin;
            z-index: 100;
            transform-origin: bottom center;
            transform: rotate(-28deg) rotateY(30deg) scale(1.04);
            animation: flower__g-front-ans 2s linear infinite;
        }
        .flower__g-front__line {
            width: 0.3vmin;
            height: 20vmin;
            background-image: linear-gradient(to top, transparent, var(--color-pasto-brillante), transparent 100%);
            position: relative;
        }
        .flower__g-front__leaf-wrapper { position: absolute; top: 0; left: 0; transform-origin: bottom left; transform: rotate(10deg); }
        .flower__g-front__leaf-wrapper:nth-child(even) { left: 0vmin; transform: rotateY(-180deg) rotate(5deg); animation: flower__g-front__leaf-left-ans 1s ease-in backwards; }
        .flower__g-front__leaf-wrapper:nth-child(odd) { animation: flower__g-front__leaf-ans 1s ease-in backwards; }
        .flower__g-front__leaf-wrapper--1 { top: -8vmin; transform: scale(0.7); animation: flower__g-front__leaf-ans 1s 5.5s ease-in backwards !important; }
        .flower__g-front__leaf-wrapper--2 { top: -8vmin; transform: rotateY(-180deg) scale(0.7) !important; animation: flower__g-front__leaf-left-ans-2 1s 4.6s ease-in backwards !important; }
        .flower__g-front__leaf-wrapper--3 { top: -3vmin; animation: flower__g-front__leaf-ans 1s 4.6s ease-in backwards; }
        .flower__g-front__leaf-wrapper--4 { top: -3vmin; transform: rotateY(-180deg) scale(0.9) !important; animation: flower__g-front__leaf-left-ans-2 1s 4.6s ease-in backwards !important; }
        .flower__g-front__leaf-wrapper--5, .flower__g-front__leaf-wrapper--6 { top: 2vmin; }
        .flower__g-front__leaf-wrapper--7, .flower__g-front__leaf-wrapper--8 { top: 6.5vmin; }
        .flower__g-front__leaf-wrapper--2 { animation-delay: 5.2s !important; }
        .flower__g-front__leaf-wrapper--3 { animation-delay: 4.9s !important; }
        .flower__g-front__leaf-wrapper--5 { animation-delay: 4.3s !important; }
        .flower__g-front__leaf-wrapper--6 { animation-delay: 4.1s !important; }
        .flower__g-front__leaf-wrapper--7 { animation-delay: 3.8s !important; }
        .flower__g-front__leaf-wrapper--8 { animation-delay: 3.5s !important; }
        
        .flower__g-front__leaf {
            width: 10vmin;
            height: 10vmin;
            border-radius: 100% 0% 0% 100%/100% 100% 0% 0%;
            box-shadow: inset 0 2px 1vmin hsla(184, 97%, 58%, 0.2);
            background-image: linear-gradient(to bottom left, transparent, var(--color-fondo-oscuro)), linear-gradient(to bottom right, var(--color-pasto-brillante) 50%, transparent 50%, transparent);
            -webkit-mask-image: linear-gradient(to bottom right, var(--color-pasto-brillante) 50%, transparent 50%, transparent);
            mask-image: linear-gradient(to bottom right, var(--color-pasto-brillante) 50%, transparent 50%, transparent);
        }
        .flower__g-fr {
            position: absolute;
            bottom: -4vmin;
            left: vmin;
            transform-origin: bottom left;
            z-index: 10;
            animation: flower__g-fr-ans 2s linear infinite;
        }
        .flower__g-fr .leaf {
            width: 30vmin;
            height: 50vmin;
            border-top-left-radius: 100%;
            border-left: 2vmin solid var(--color-pasto-brillante);
            -webkit-mask-image: linear-gradient(to top, transparent 25%, var(--color-pasto-brillante) 50%);
            position: relative;
            z-index: 1;
        }
        .flower__g-fr__leaf {
            position: absolute;
            top: 0;
            left: 0;
            width: 10vmin;
            height: 10vmin;
            border-radius: 100% 0% 0% 100%/100% 100% 0% 0%;
            box-shadow: inset 0 2px 1vmin hsla(184, 97%, 58%, 0.2);
            background-image: linear-gradient(to bottom left, transparent, var(--color-fondo-oscuro) 98%), linear-gradient(to bottom right, var(--color-pasto-brillante) 45%, transparent 50%, transparent);
            -webkit-mask-image: linear-gradient(135deg, var(--color-pasto-brillante) 40%, transparent 50%, transparent);
        }
        .flower__g-fr__leaf--1 { left: 20vmin; transform: rotate(45deg); animation: flower__g-fr-leaft-ans-1 0.5s 5.2s linear backwards; }

        /* 1. Estilos para la superposición del audio */
        #audio-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 9999;

            font-weight: 400;

        /* Estilos para el rayo */
        .lightning {
            width: 200px;
            height: 300px;
            position: relative;
            animation: heartbeat 1.2s ease-in-out infinite; 
            filter: drop-shadow(0 0 10px var(--color-overlay-glow)) 
                    drop-shadow(0 0 25px var(--color-overlay-glow));
        }

        .lightning svg {
            width: 100%;
            height: 100%;
            fill: #ffd700; /* Color amarillo para el rayo */
        }

        #audio-overlay .lightning {
            animation-play-state: running !important;
        }

        @keyframes heartbeat {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 10px var(--color-overlay-glow));
            }
            30% {
                transform: scale(1.2);
                filter: drop-shadow(0 0 25px var(--color-overlay-glow)) drop-shadow(0 0 45px var(--color-overlay-glow));
            }
            40% {
                transform: scale(1.15);
            }
            60% {
                transform: scale(1.2);
                filter: drop-shadow(0 0 25px var(--color-overlay-glow)) drop-shadow(0 0 55px var(--color-overlay-glow));
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 10px var(--color-overlay-glow));
            }
        }

        .background-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            bottom: 0;
            width: 6px;
            height: 6px;
            background-color: rgba(173, 216, 230, 0.5);
            border-radius: 50%;
            opacity: 0;

            filter: blur(1px);

        @keyframes background-sparkle {

                transform: translateY(-100vh) scale(1.5);

            animation-delay: 0s;
        }   
        
        /* Hace visible el contenedor del título SÓLO si el body NO tiene la clase .container */

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            // --- LÓGICA PARA EL AUDIO Y LA SUPERPOSICIÓN ---
            const audioOverlay = document.getElementById('audio-overlay');
            const music = document.getElementById('background-music');
          

            // Función para iniciar el audio y ocultar la superposición
            function startExperience() {
                // El método play() devuelve una promesa. Lo manejamos para evitar errores en consola.
                const playPromise = music.play();
                if (playPromise !== undefined) {
                    playPromise.then(_ => {
                        // Autoplay iniciado correctamente
                    }).catch(error => {
                        // Autoplay fue prevenido. No es un gran problema ya que el usuario lo inició.
                        console.log("Autoplay prevenido, pero el usuario hizo clic.");
                    });
                }

                // !! CAMBIO CLAVE: Esta línea inicia TODAS las animaciones de la página !!
                // Se elimina la clase 'container' del body, lo que activa el 'animation-play-state'.
                document.body.classList.remove("container");

                // Ocultar la superposición
                audioOverlay.style.opacity = '0';
                // Después de que termine la transición, oculta el elemento para que no sea interactuable
                setTimeout(() => {
                    audioOverlay.style.display = 'none';
                }, 800); // 800ms, igual que la transición en el CSS
            }
            
            // Añadimos el evento de clic a la superposición
            audioOverlay.addEventListener('click', startExperience);

            // --- LÓGICA PARA LAS BURBUJAS DE MENSAJE ---
            const imageContainers = document.querySelectorAll('.flower__image-container');
            
            imageContainers.forEach(container => {
                container.addEventListener('click', function(e) {
                    // Crear la burbuja de mensaje
                    const bubble = document.createElement('div');
                    bubble.classList.add('message-bubble');
                    bubble.textContent = 'Te quiero mucho';
                    
                    // Posicionar la burbuja cerca de la imagen
                    const rect = this.getBoundingClientRect();
                    bubble.style.left = `${rect.left + rect.width/2}px`;
                    bubble.style.top = `${rect.top - 50}px`;
                    
                    // Agregar la burbuja al body
                    document.body.appendChild(bubble);
                    
                    // Eliminar la burbuja después de 3 segundos
                    setTimeout(() => {
                        if (bubble.parentNode) {
                            bubble.parentNode.removeChild(bubble);
                        }
                    }, 3000);
                });
            });

            // --- LÓGICA PARA GENERAR PARTÍCULAS DE FONDO ---

            const particleContainer = document.querySelector('.background-particles');
            // Aumentamos la cantidad de partículas para un efecto más denso
            const numberOfParticles = 60; 

            for (let i = 0; i < numberOfParticles; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                particle.style.left = Math.random() * 100 + 'vw';
                
                // Reducimos la duración para que se muevan más rápido
                // Ahora la duración será entre 5 y 13 segundos (antes 15-30s)
                particle.style.animationDuration = (Math.random() * 8 + 5) + 's'; 
                
                particle.style.animationDelay = (Math.random() * 10) + 's';
                
                particleContainer.appendChild(particle);
            }

        });      
    </script>
